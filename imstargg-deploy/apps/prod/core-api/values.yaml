workload:
  kind: Deployment
imagePullSecrets:
  - name: ecr-pull-secret
deployment:
  replicaCount: 2
  image:
    repository: 347351797221.dkr.ecr.ap-northeast-2.amazonaws.com/imstargg/core-api
    tag: "0.5.1-7aef2d1"
    pullPolicy: Always
  ports:
    - name: http
      containerPort: 8080
      protocol: TCP
    - name: metrics
      containerPort: 9292
      protocol: TCP
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: REDIS_HOST
      value: valkey-imstargg-primary.valkey
    - name: REDIS_PORT
      value: "6379"
  envFrom:
    - secretRef:
        name: core-api-secret
  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      memory: 2Gi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9292
      targetPort: metrics
      protocol: TCP
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: api.imstargg.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: core-api-tls
      hosts:
        - api.imstargg.com
