workload:
  kind: CronJob
imagePullSecrets:
  - name: ecr-pull-secret
cronjob:
  image:
    repository: 347351797221.dkr.ecr.ap-northeast-2.amazonaws.com/imstargg/core-batch
    tag: "0.3.1-8378e2c"
    pullPolicy: Always
  command:
    - /bin/sh
    - -c
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
  envFrom:
    - secretRef:
        name: core-batch-secret
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
# CronJob 스케줄·args 의 date 파라미터 모두 UTC 기준 (쿠버네티스 CronJob·컨테이너 기본 타임존).
# 우측 주석은 대응 KST(UTC+9). date 보정: KST 오늘=$(date -u -d '9 hours' ...), KST 전일=$(date -u -d '15 hours ago' ...).
jobs:
  - name: partition-manage
    schedule: "0 17 * * *" # 02:00 KST
    args:
      - "java -jar /app/application.jar --job.name=partitionManageJob date=$(date -u -d '9 hours' +%Y-%m-%d)"
  - name: battle-event-mode-sync
    schedule: "0 23 * * *" # 08:00 KST
    args:
      - "java -jar /app/application.jar --job.name=battleEventModeSyncJob"
  - name: battle-event-rotation-sync
    schedule: "0 * * * *" # 매시 정각
    args:
      - "java -jar /app/application.jar --job.name=battleEventRotationSyncJob"
  - name: battle-event-sync
    schedule: "0 23 * * *" # 08:00 KST
    args:
      - "java -jar /app/application.jar --job.name=battleEventSyncJob date=$(date -u -d '15 hours ago' +%Y-%m-%d)"
  - name: brawlstars-api-spec-track
    schedule: "0 22 * * *" # 07:00 KST
    args:
      - "java -jar /app/application.jar --job.name=brawlStarsApiSpecTrackJob"
  - name: brawler-sync
    schedule: "30 0 * * *" # 09:30 KST
    args:
      - "java -jar /app/application.jar --job.name=brawlerSyncJob"
  - name: ranking-collect
    schedule: "*/30 * * * *" # 매 30분
    args:
      - "java -jar /app/application.jar --job.name=rankingCollectJob window=$(($(date +%s)/1800))"
  - name: battle-rank-stats
    schedule: "0 17 * * *" # 02:00 KST
    args:
      - "java -jar /app/application.jar --job.name=brawlerBattleRankStatsJob date=$(date -u -d '15 hours ago' +%Y-%m-%d)"
  - name: battle-result-stats
    schedule: "0 18 * * *" # 03:00 KST
    args:
      - "java -jar /app/application.jar --job.name=brawlerBattleResultStatsJob date=$(date -u -d '15 hours ago' +%Y-%m-%d)"
  - name: enemy-battle-result-stats
    schedule: "0 19 * * *" # 04:00 KST
    args:
      - "java -jar /app/application.jar --job.name=brawlerEnemyBattleResultStatsJob date=$(date -u -d '15 hours ago' +%Y-%m-%d)"
  - name: pair-battle-rank-stats
    schedule: "0 21 * * *" # 06:00 KST
    args:
      - "java -jar /app/application.jar --job.name=brawlerPairBattleRankStatsJob date=$(date -u -d '15 hours ago' +%Y-%m-%d)"
  - name: pair-battle-result-stats
    schedule: "0 22 * * *" # 07:00 KST
    args:
      - "java -jar /app/application.jar --job.name=brawlerPairBattleResultStatsJob date=$(date -u -d '15 hours ago' +%Y-%m-%d)"
  - name: brawler-item-ownership-stats
    schedule: "0 23 * * *" # 08:00 KST
    args:
      - "java -jar /app/application.jar --job.name=brawlerItemOwnershipStatsJob"
  - name: stats-player-sync
    schedule: "0 0 * * *" # 09:00 KST
    args:
      - "java -jar /app/application.jar --job.name=statsPlayerSyncJob date=$(date -u -d '15 hours ago' +%Y-%m-%d)"
  - name: stats-player-sync-from-ranking
    schedule: "0 0 * * *" # 09:00 KST
    args:
      - "java -jar /app/application.jar --job.name=statsPlayerSyncFromRankingJob"
  - name: feedback-daily-digest
    schedule: "0 0 * * *" # 09:00 KST
    args:
      - "java -jar /app/application.jar --job.name=feedbackDailyDigestJob"
