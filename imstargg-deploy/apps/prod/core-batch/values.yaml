workload:
  kind: CronJob
imagePullSecrets:
  - name: ecr-pull-secret
cronjob:
  image:
    repository: 347351797221.dkr.ecr.ap-northeast-2.amazonaws.com/imstargg/core-batch
    tag: "6d93019"
    pullPolicy: Always
  command:
    - /bin/sh
    - -c
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
  envFrom:
    - secretRef:
        name: core-batch-secret
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
jobs:
  - name: partition-manage
    schedule: "0 2 * * *"
    args:
      - "java -jar /app/app.jar --job.name=partitionManageJob date=$(date +%Y-%m-%d)"
  - name: battle-event-mode-sync
    schedule: "0 8 * * *"
    args:
      - "java -jar /app/app.jar --job.name=battleEventModeSyncJob"
  - name: battle-event-rotation-sync
    schedule: "0 * * * *"
    args:
      - "java -jar /app/app.jar --job.name=battleEventRotationSyncJob"
  - name: battle-event-sync
    schedule: "0 8 * * *"
    args:
      - "java -jar /app/app.jar --job.name=battleEventSyncJob"
  - name: brawlstars-api-spec-track
    schedule: "0 7 * * *"
    args:
      - "java -jar /app/app.jar --job.name=brawlStarsApiSpecTrackJob"
# TODO(rankingCollectJob 전환): rankingCollectJob 이 포함된 core-batch 이미지가 배포된 뒤
# 아래 랭킹 CronJob 3개를 다음 1개로 교체하고, 코드의 레거시 별칭 잡 3개를 제거한다.
#   - name: ranking-collect
#     schedule: "*/30 * * * *"
#     args:
#       - "java -jar /app/app.jar --job.name=rankingCollectJob window=$(($(date +%s)/1800))"
  - name: brawler-ranking-collect
    schedule: "*/30 * * * *"
    args:
      - "java -jar /app/app.jar --job.name=brawlerRankingCollectJob"
  - name: club-ranking-collect
    schedule: "*/30 * * * *"
    args:
      - "java -jar /app/app.jar --job.name=clubRankingCollectJob"
  - name: player-ranking-collect
    schedule: "*/30 * * * *"
    args:
      - "java -jar /app/app.jar --job.name=playerRankingCollectJob"
  - name: battle-rank-stats
    schedule: "0 2 * * *"
    args:
      - "java -jar /app/app.jar --job.name=brawlerBattleRankStatsJob date=$(date -d 'yesterday' +%Y-%m-%d)"
  - name: battle-result-stats
    schedule: "0 3 * * *"
    args:
      - "java -jar /app/app.jar --job.name=brawlerBattleResultStatsJob date=$(date -d 'yesterday' +%Y-%m-%d)"
  - name: enemy-battle-result-stats
    schedule: "0 4 * * *"
    args:
      - "java -jar /app/app.jar --job.name=brawlerEnemyBattleResultStatsJob date=$(date -d 'yesterday' +%Y-%m-%d)"
  - name: pair-battle-rank-stats
    schedule: "0 6 * * *"
    args:
      - "java -jar /app/app.jar --job.name=brawlerPairBattleRankStatsJob date=$(date -d 'yesterday' +%Y-%m-%d)"
  - name: pair-battle-result-stats
    schedule: "0 7 * * *"
    args:
      - "java -jar /app/app.jar --job.name=brawlerPairBattleResultStatsJob date=$(date -d 'yesterday' +%Y-%m-%d)"
  - name: brawler-item-ownership-stats
    schedule: "0 8 * * *"
    args:
      - "java -jar /app/app.jar --job.name=brawlerItemOwnershipStatsJob"
  - name: stats-player-sync
    schedule: "0 9 * * *"
    args:
      - "java -jar /app/app.jar --job.name=statsPlayerSyncJob date=$(date -d 'yesterday' +%Y-%m-%d)"
  - name: stats-player-sync-from-ranking
    schedule: "0 9 * * *"
    args:
      - "java -jar /app/app.jar --job.name=statsPlayerSyncFromRankingJob"
