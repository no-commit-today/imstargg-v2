workload:
  kind: Deployment
imagePullSecrets:
  - name: ecr-pull-secret
deployment:
  replicaCount: 1
  image:
    repository: 347351797221.dkr.ecr.ap-northeast-2.amazonaws.com/imstargg/core-worker
    tag: "0.2.4-3a30992"
    pullPolicy: Always
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
  envFrom:
    - secretRef:
        name: core-worker-secret
  ports:
    - name: metrics
      containerPort: 9292
      protocol: TCP
  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      memory: 2Gi
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: metrics
      port: 9292
      targetPort: metrics
      protocol: TCP
ingress:
  enabled: false
