# AWS Emulator 는 시작할 때마다 새로 만든 자체 서명 인증서로 HTTPS 만 제공한다.
# JVM 신뢰 저장소를 바꾸면 다른 HTTPS 호출(Brawl Stars API 등)이 깨지고 브라우저도 이미지를 못 읽으므로,
# 평문 HTTP 로 받아 emulator 에 넘긴다. emulator 인증서는 검증하지 않는다(nginx 기본값).

# emulator 는 웹 페이지에서 온 요청(Origin 헤더, Sec-Fetch-Site 가 same-site·cross-site)을 서명 검사를 꺼도 403 으로 막는다.
# 프론트엔드(localhost:3000)가 <img> 로 로컬 이미지 URL 을 읽으려면 그 표식을 떼야 하므로,
# 읽기 요청(GET·HEAD)에서만 떼고 상태를 바꾸는 요청에는 그대로 넘겨 보호를 유지한다. 값이 빈 헤더는 nginx 가 넘기지 않는다.
map $request_method $emulator_origin {
    GET     "";
    HEAD    "";
    default $http_origin;
}

map $request_method $emulator_sec_fetch_site {
    GET     "";
    HEAD    "";
    default $http_sec_fetch_site;
}

server {
    listen 4566;

    # 이미지 업로드 크기 제한을 두지 않는다 (nginx 기본 1m)
    client_max_body_size 0;

    location / {
        proxy_pass https://aws-emulator:9297;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $emulator_origin;
        proxy_set_header Sec-Fetch-Site $emulator_sec_fetch_site;
        # SDK 의 chunked 업로드와 SQS long polling 응답을 버퍼링 없이 흘려보낸다
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
