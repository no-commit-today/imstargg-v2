management:
  server:
    port: 9292
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - info
          - health
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    build:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
