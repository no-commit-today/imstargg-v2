spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1000ms
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 5
          max-idle: 5
          min-idle: 1
          enabled: true
          max-wait: 1000ms
          time-between-eviction-runs: 1000ms

app:
  redis:
    stream:
      player-renewal:
        key: renewal:player
        maxlen: 10000
      club-renewal:
        key: renewal:club
        maxlen: 10000
      consumer:
        group: renewal-worker-group
        name: ${HOSTNAME:worker-1}

---
spring:
  config:
    activate:
      on-profile: local

  data:
    redis:
      host: localhost
      port: 6379

---
spring:
  config:
    activate:
      on-profile: local-dev

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: live

  data:
    redis:
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
