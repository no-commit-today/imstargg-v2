spring:
  cloud:
    aws:
      region:
        static: ap-northeast-2

app:
  aws:
    sqs:
      renewal:
        player-queue-name: player-renewal
        club-queue-name: club-renewal

---
spring.config.activate.on-profile: local
spring:
  cloud:
    aws:
      sqs:
        endpoint: http://localhost:4566
      credentials:
        access-key: test
        secret-key: test

app:
  aws:
    sqs:
      renewal:
        player-queue-name: local-player-renewal
        club-queue-name: local-club-renewal

---
spring.config.activate.on-profile: dev
spring:
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}

app:
  aws:
    sqs:
      renewal:
        player-queue-name: dev-player-renewal
        club-queue-name: dev-club-renewal

---
spring.config.activate.on-profile: prod
spring:
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}

app:
  aws:
    sqs:
      renewal:
        player-queue-name: prod-player-renewal
        club-queue-name: prod-club-renewal
