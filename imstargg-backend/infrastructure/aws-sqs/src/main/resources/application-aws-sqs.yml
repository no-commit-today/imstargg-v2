spring:
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}

---
spring.config.activate.on-profile: local
spring:
  cloud:
    aws:
      sqs:
        endpoint: http://localhost:4566
      credentials:
        access-key: test
        secret-key: test

app:
  aws:
    sqs:
      renewal:
        player-queue-name: imstargg-player-renewal-local
        club-queue-name: imstargg-club-renewal-local

---
spring.config.activate.on-profile: dev

app:
  aws:
    sqs:
      renewal:
        player-queue-name: imstargg-player-renewal-dev
        club-queue-name: imstargg-club-renewal-dev

---
spring.config.activate.on-profile: prod

app:
  aws:
    sqs:
      renewal:
        player-queue-name: imstargg-player-renewal-prod
        club-queue-name: imstargg-club-renewal-prod
