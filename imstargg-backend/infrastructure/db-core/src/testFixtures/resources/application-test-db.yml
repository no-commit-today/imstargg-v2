spring:
  config:
    activate:
      on-profile: test-db

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        default_batch_fetch_size: 300
        query.fail_on_pagination_over_collection_fetch: true
        format_sql: true
        use_sql_comments: true
        # 운영(각 앱 application.yml)과 동일한 INSERT/UPDATE 배칭 — 테스트가 배칭 경로를 그대로 타게 한다
        jdbc:
          batch_size: 100
          batch_versioned_data: false
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: never

storage:
  datasource:
    core:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:test-db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;
      username: sa
      password:
