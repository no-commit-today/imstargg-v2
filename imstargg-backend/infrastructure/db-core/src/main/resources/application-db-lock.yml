storage:
  datasource:
    lock:
      driver-class-name: org.postgresql.Driver
      jdbc-url: ${DATABASE_URL}
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
      pool-name: lock-db-pool
      minimum-idle: 1
      maximum-pool-size: 3
      connection-timeout: 1100
      validation-timeout: 1000
      keepalive-time: 30000
      max-lifetime: 1800000
      data-source-properties:
        socketTimeout: 3

---
spring:
  config:
    activate:
      on-profile: local

storage:
  datasource:
    lock:
      jdbc-url: jdbc:postgresql://localhost:5432/imstargg
      username: postgres
      password: secret

---
spring:
  config:
    activate:
      on-profile: prod

storage:
  datasource:
    lock:
      minimum-idle: 3
      maximum-pool-size: 5
