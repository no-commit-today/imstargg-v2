storage:
  datasource:
    lock:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: ${DATABASE_URL}
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
      hikari:
        pool-name: lock-db-pool
        minimum-idle: 1
        maximum-pool-size: 3
        connection-timeout: 1100
        validation-timeout: 1000
        keepalive-time: 30000
        max-lifetime: 1800000
        data-source-properties:
          socketTimeout: 3000
          serverTimezone: UTC
          connectionTimeZone: UTC

---
spring:
  config:
    activate:
      on-profile: local

storage:
  datasource:
    lock:
      jdbc-url: jdbc:mysql://localhost:3306/imstargg
      username: root
      password: secret

---
spring:
  config:
    activate:
      on-profile: prod

storage:
  datasource:
    lock:
      hikari:
        minimum-idle: 3
        maximum-pool-size: 5
