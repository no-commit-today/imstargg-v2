spring:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 300
        query.fail_on_pagination_over_collection_fetch: true
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE

  sql:
    init:
      mode: never

storage:
  datasource:
    core:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: ${DATABASE_URL}
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
      hikari:
        pool-name: core-db-pool
        minimum-idle: 5
        maximum-pool-size: 5
        connection-timeout: 1100
        validation-timeout: 1000
        keepalive-time: 30000
        max-lifetime: 1800000
        data-source-properties:
          rewriteBatchedStatements: true
          socketTimeout: 3000
          cachePrepStmts: true
          prepStmtCacheSize: 250
          prepStmtCacheSqlLimit: 2048
          useServerPrepStmts: true
          useLocalSessionState: true
          cacheResultSetMetadata: true
          cacheServerConfiguration: true
          elideSetAutoCommits: true
          maintainTimeStats: false
          serverTimezone: UTC
          connectionTimeZone: UTC

---
spring:
  config:
    activate:
      on-profile: local


storage:
  datasource:
    core:
      jdbc-url: jdbc:mysql://localhost:3306/imstargg
      username: root
      password: secret
      hikari:
        data-source-properties:
          profileSQL: true
          logger: Slf4JLogger
          maxQuerySizeToLog: 999999

logging.level:
  org.hibernate:
    SQL: debug
    orm.jdbc.bind: trace

---
spring:
  config:
    activate:
      on-profile: local-dev

logging.level:
  org.hibernate:
    SQL: debug
    orm.jdbc.bind: trace

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: prod

storage:
  datasource:
    core:
      hikari:
        minimum-idle: 10
        maximum-pool-size: 15

---
spring:
  config:
    activate:
      on-profile: batch

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          batch_versioned_data: false
        order_inserts: true
        order_updates: true

storage:
  datasource:
    core:
      hikari:
        minimum-idle: 0
        maximum-pool-size: 5
        data-source-properties:
          socketTimeout: 0
