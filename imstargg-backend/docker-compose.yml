services:
  postgresql:
    image: postgres:18.3
    container_name: imstargg-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: imstargg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      TZ: UTC
    volumes:
      - ./docker/postgresql/var/lib/postgresql:/var/lib/postgresql # data
      - ./docker/postgresql/init:/docker-entrypoint-initdb.d # init
  valkey:
    image: valkey/valkey:9.0.3
    container_name: imstargg-valkey
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - ./docker/valkey/data:/data
  # S3·SQS 에뮬레이터. 상태는 메모리에만 두므로 재시작하면 버킷·큐·객체가 사라진다
  # (버킷·큐는 앱의 Local*Initializer 가 기동 시 다시 만든다)
  aws-emulator:
    build: ./local/aws-emulator
    container_name: imstargg-aws-emulator
    # 로컬 전용이라 서명 검사를 끈다 — 포트는 프록시만 127.0.0.1 로 연다
    command: ["-p", "9297", "--auth", "off", "--telemetry", "off"]
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-sfk", "https://127.0.0.1:9297/__admin/health"]
      interval: 2s
      timeout: 2s
      retries: 30
  # emulator 의 HTTPS 를 평문 HTTP(localhost:4566) 로 노출한다 — 이유는 nginx.conf 참고
  aws-emulator-proxy:
    image: nginx:1.29.8-alpine
    container_name: imstargg-aws-emulator-proxy
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./local/aws-emulator/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      aws-emulator:
        condition: service_healthy
