services:
  mysql:
    image: mysql:8.4.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: imstargg
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: secret
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./docker/mysql/var/lib/mysql:/var/lib/mysql # data
      - ./docker/mysql/etc/mysql/conf.d:/etc/mysql/conf.d # config
      - ./docker/mysql/init:/docker-entrypoint-initdb.d # init
  valkey:
    image: valkey/valkey:9.0.3
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - ./docker/valkey/data:/data
  localstack:
    image: localstack/localstack:2026.03.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3
      - DEFAULT_REGION=ap-northeast-2
    volumes:
      - ./docker/localstack/data:/var/lib/localstack
