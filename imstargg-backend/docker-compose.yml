services:
  postgresql:
    image: postgres:18.3
    container_name: imstargg-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: imstargg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      TZ: UTC
    volumes:
      - ./docker/postgresql/var/lib/postgresql:/var/lib/postgresql # data
      - ./docker/postgresql/init:/docker-entrypoint-initdb.d # init
  valkey:
    image: valkey/valkey:9.0.3
    container_name: imstargg-valkey
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - ./docker/valkey/data:/data
  floci:
    image: hectorvent/floci:1.3.0
    container_name: imstargg-floci
    ports:
      - "4566:4566"
    volumes:
      - ./docker/floci/app/data:/app/data
      - ./docker/floci/data:/data
