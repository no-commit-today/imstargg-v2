services:
  mysql:
    image: mysql:8.4.7
    container_name: imstargg-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: imstargg
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: secret
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./docker/mysql/var/lib/mysql:/var/lib/mysql # data
      - ./docker/mysql/etc/mysql/conf.d:/etc/mysql/conf.d # config
      - ./docker/mysql/init:/docker-entrypoint-initdb.d # init
  valkey:
    image: valkey/valkey:9.0.3
    container_name: imstargg-valkey
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - ./docker/valkey/data:/data
  floci:
    image: hectorvent/floci:1.3.0
    container_name: imstargg-floci
    ports:
      - "4566:4566"
    volumes:
      - ./docker/floci/app/data:/app/data
      - ./docker/floci/data:/data
