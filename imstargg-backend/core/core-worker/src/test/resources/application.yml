spring:
  profiles:
    active: test-db

  # 운영과 같은 HTTP 클라이언트 설정(HC5·타임아웃)으로 띄운다. brawlstars-client.yml 은 가져오지 않는다 —
  # import 한 파일의 값이 이 파일 값보다 우선해 아래 테스트용 app.client.brawlstars.* 값이 덮인다.
  config:
    import:
      - http-client.yml

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test

  task:
    execution:
      thread-name-prefix: "worker-task-"
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 10000
      shutdown:
        await-termination: true
        await-termination-period: 30s

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

app:
  client:
    brawlstars:
      url: https://api.brawlstars.com
      api-keys:
        - test-api-key
  aws:
    sqs:
      renewal:
        player-queue-name: test-player-renewal
        club-queue-name: test-club-renewal
