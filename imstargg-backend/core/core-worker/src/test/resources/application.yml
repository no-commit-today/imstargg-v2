spring:
  profiles:
    active: test-db

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

app:
  client:
    brawlstars:
      url: https://api.brawlstars.com
      api-keys:
        - test-api-key
  aws:
    sqs:
      renewal:
        player-queue-name: test-player-renewal
        club-queue-name: test-club-renewal
