spring:
  profiles:
    active: test-db

  task:
    execution:
      thread-name-prefix: "worker-task-"
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 10000
      shutdown:
        await-termination: true
        await-termination-period: 10000

app:
  client:
    brawlstars:
      url: https://api.brawlstars.com
      api-keys:
        - test-api-key
  redis:
    stream:
      player-renewal:
        key: test-renewal:player
      club-renewal:
        key: test-renewal:club
      consumer:
        group: test-renewal-group
        name: test-worker
