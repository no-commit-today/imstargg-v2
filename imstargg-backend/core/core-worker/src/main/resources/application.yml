spring:

  application:
    name: core-worker

  profiles:
    active: local
    include:
      - db
      - db-lock
      - pubsub

  config:
    import:
      - logging.yml
      - monitoring.yml

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: local-dev

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: live
