spring:

  application:
    name: imstargg-core-worker

  profiles:
    active: local
    group:
      local:     [db, aws-sqs]
      local-dev: [db, aws-sqs]
      dev:       [db, aws-sqs]
      prod:      [db, aws-sqs]

  config:
    import:
      - brawlstars-client.yml
      - logging.yml
      - monitoring.yml

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          batch_versioned_data: false
        order_inserts: true
        order_updates: true

storage:
  datasource:
    core:
      minimum-idle: 5
      maximum-pool-size: 5

app:
  schedule:
    stats-battle:
      enabled: true
      interval: 1s
      player-count: 1
    player-refresh:
      enabled: true
      interval: 60s
      player-count: 1

---
spring:
  config:
    activate:
      on-profile: local

app:
  schedule:
    stats-battle:
      enabled: false
      interval: 1s
      player-count: 1
    player-refresh:
      enabled: false
      interval: 60s
      player-count: 1
---
spring:
  config:
    activate:
      on-profile: local-dev

app:
  schedule:
    stats-battle:
      enabled: false
    player-refresh:
      enabled: false
---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: prod
