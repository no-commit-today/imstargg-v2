spring:

  application:
    name: core-worker

  profiles:
    active: local
    include:
      - db
      - db-lock
      - aws-sqs

  config:
    import:
      - logging.yml
      - monitoring.yml

app:
  schedule:
    stats-battle:
      enabled: false
      interval: 1s
      player-count: 1

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: local-dev

---
spring:
  config:
    activate:
      on-profile: dev

app:
  schedule:
    stats-battle:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod

app:
  schedule:
    stats-battle:
      enabled: true
