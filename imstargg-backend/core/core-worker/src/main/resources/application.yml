spring:

  application:
    name: imstargg-core-worker

  profiles:
    active: local
    group:
      local:     [db, aws-sqs, redis]
      local-dev: [db, aws-sqs, redis]
      dev:       [db, aws-sqs, redis]
      prod:      [db, aws-sqs, redis]

  config:
    import:
      - http-client.yml
      - brawlstars-client.yml
      - logging.yml
      - monitoring.yml

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          batch_versioned_data: false
        order_inserts: true
        order_updates: true

server:
  shutdown: graceful

storage:
  datasource:
    core:
      minimum-idle: 5
      maximum-pool-size: 5

app:
  schedule:
    stats-battle:
      enabled: true
      # 600ms 마다 5명 = 초당 약 8.3회 호출. 공용 레이트리미터(prod 초당 10회)를 갱신 요청과 나눠 쓴다
      interval: 600ms
      player-count: 5
      # 동시에 보내는 battlelog 요청 수 — 5명을 3개씩 나눠 보내도 응답 약 0.2초면 한 틱(600ms) 안에 끝난다
      concurrency: 3
    player-refresh:
      enabled: true
      interval: 60s
      player-count: 1
    stats-event-mode-reload:
      enabled: true
      # 관리자가 바꾼 통계 수집 모드가 반영되기까지의 최대 지연. core-api 로컬 캐시 만료(5분)와 같다
      interval: 5m

---
spring:
  config:
    activate:
      on-profile: local

app:
  schedule:
    stats-battle:
      enabled: false
      interval: 1s
      player-count: 1
    player-refresh:
      enabled: false
      interval: 60s
      player-count: 1
---
spring:
  config:
    activate:
      on-profile: local-dev

app:
  schedule:
    stats-battle:
      enabled: false
    player-refresh:
      enabled: false
---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: prod
