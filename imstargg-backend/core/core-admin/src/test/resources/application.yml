spring:
  profiles:
    active: test-db

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  aws:
    s3:
      bucket: imstargg-images-local
    cloudfront:
      baseUrl: http://localhost:4566/imstargg-images-local
