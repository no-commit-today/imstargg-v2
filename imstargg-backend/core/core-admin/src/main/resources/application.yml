spring:

  application:
    name: imstargg-core-admin

  profiles:
    active: local
    include:
      - db
      - aws-s3

  mvc:
    problemdetails:
      enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:3000

---
spring:
  config.activate.on-profile: local

app:
  aws:
    cloudfront:
      baseUrl: http://localhost:4566/imstargg-images-local

---
spring:
  config.activate.on-profile: local-dev

app:
  aws:
    cloudfront:
      baseUrl: http://localhost:4566/imstargg-images-local

---
spring:
  config.activate.on-profile: dev

app:
  cors:
    allowed-origins:
      - http://localhost:3000

---
spring:
  config.activate.on-profile: prod

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  aws:
    cloudfront:
      baseUrl: https://cdn.imstargg.com
