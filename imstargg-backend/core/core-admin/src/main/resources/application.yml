spring:
  application:
    name: core-admin

  profiles:
    active: local
    include:
      - db
      - aws-s3

vaadin:
  launch-browser: false

---
spring:
  config.activate.on-profile: local

app:
  image:
    base-url: http://localhost:4566/imstargg-images-local

---
spring:
  config.activate.on-profile: local-dev

---
spring:
  config.activate.on-profile: dev

---
spring:
  config.activate.on-profile: prod

app:
  image:
    base-url: https://cdn.imstargg.com
