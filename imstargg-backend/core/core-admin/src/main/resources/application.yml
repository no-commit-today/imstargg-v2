spring:
  application:
    name: core-admin

  profiles:
    active: local
    include:
      - db
      - aws-s3

app:
  cors:
    allowed-origins:
      - http://localhost:3000

---
spring:
  config.activate.on-profile: local

---
spring:
  config.activate.on-profile: local-dev

---
spring:
  config.activate.on-profile: dev

app:
  cors:
    allowed-origins:
      - https://admin.imstargg.com

---
spring:
  config.activate.on-profile: prod

app:
  cors:
    allowed-origins:
      - https://admin.imstargg.com
