spring:

  profiles:
    active: local
    group:
      local:     [db, aws-sqs, redis]
      local-dev: [db, aws-sqs, redis]
      dev:       [db, aws-sqs, redis]
      prod:      [db, aws-sqs, redis]

  config.import:
    - logging.yml
    - monitoring.yml

server:
  tomcat:
    max-connections: 20000
    threads:
      max: 600
      min-spare: 100

storage:
  datasource:
    core:
      minimum-idle: 10
      maximum-pool-size: 10
---
spring:
  config.activate.on-profile: local

logging:
  level:
    org.apache.coyote.http11: trace

app:
  aws:
    cloudfront:
      baseUrl: http://localhost:4566/imstargg-images-local
---
spring:
  config.activate.on-profile: local-dev

logging:
  level:
    org.apache.coyote.http11: trace

app:
  aws:
    cloudfront:
      baseUrl: http://localhost:4566/imstargg-images-local

---
spring:
  config.activate.on-profile: dev

---
spring:
  config.activate.on-profile: prod

  web.resources.add-mappings: false

app:
  aws:
    cloudfront:
      baseUrl: https://cdn.imstargg.com
  cors:
    allowed-origins:
      - https://imstargg.com
