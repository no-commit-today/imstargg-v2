spring:
  profiles:
    active: test-db

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test

  task:
    execution:
      thread-name-prefix: "core-task-"
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 10000
      shutdown:
        await-termination: true
        await-termination-period: 10000

app:
  aws:
    sqs:
      renewal:
        player-queue-name: test-player-renewal
        club-queue-name: test-club-renewal
