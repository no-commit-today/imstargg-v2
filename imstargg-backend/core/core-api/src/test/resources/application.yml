spring:
  profiles:
    active: test-db

  cloud:
    gcp:
      pubsub:
        enabled: false

  task:
    execution:
      thread-name-prefix: "core-task-"
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 10000
      shutdown:
        await-termination: true
        await-termination-period: 10000

app:
  pubsub:
    player-renewal:
      topic:
        name: test-player-renewal-topic
      subscription:
        name: test-player-renewal-subscription
    club-renewal:
      topic:
        name: test-club-renewal-topic
      subscription:
        name: test-club-renewal-subscription
