spring:
  profiles:
    active: test-db

  task:
    execution:
      thread-name-prefix: "core-task-"
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 10000
      shutdown:
        await-termination: true
        await-termination-period: 10000

app:
  redis:
    stream:
      player-renewal:
        key: test-renewal:player
        maxlen: 10000
      club-renewal:
        key: test-renewal:club
        maxlen: 10000
      consumer:
        group: test-renewal-group
        name: test-worker
