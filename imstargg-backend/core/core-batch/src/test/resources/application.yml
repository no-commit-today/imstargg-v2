spring:
  profiles:
    active: test-db

  main.web-application-type: none

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: embedded
      isolation-level-for-create: default

  task:
    execution:
      thread-name-prefix: "batch-task-"
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 10000
      shutdown:
        await-termination: true
        await-termination-period: 10000

app:
  alert:
    type: NO_OPS
