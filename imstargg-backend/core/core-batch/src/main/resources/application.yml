spring:
  application.name: core-batch

  profiles:
    active: local
    group:
      local:     [db]
      local-dev: [db]
      dev:       [db]
      prod:      [db]

  config:
    import:
      - logging.yml
      - brawlstars-client.yml

  main.web-application-type: none

  batch:
    job:
      enabled: true
      name: ${job.name:healthCheckJob}
    jdbc:
      initialize-schema: never
      isolation-level-for-create: default

  task:
    execution:
      thread-name-prefix: "batch-task-"
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 10000
      shutdown:
        await-termination: true
        await-termination-period: 10000

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          batch_versioned_data: false
        order_inserts: true
        order_updates: true

app:
  alert:
    type: NO_OPS
  schedule:
    feedback-digest:
      enabled: ${APP_SCHEDULE_FEEDBACK_DIGEST_ENABLED:false}
      cron: ${APP_SCHEDULE_FEEDBACK_DIGEST_CRON:0 0 21 * * *}

---
spring:
  config:
    activate:
      on-profile: local

storage:
  datasource:
    core:
      minimum-idle: 0
      maximum-pool-size: 5
      data-source-properties:
        socketTimeout: 0

---
spring:
  config:
    activate:
      on-profile: local-dev

storage:
  datasource:
    core:
      minimum-idle: 0
      maximum-pool-size: 5
      data-source-properties:
        socketTimeout: 0

---
spring:
  config:
    activate:
      on-profile: dev

storage:
  datasource:
    core:
      minimum-idle: 0
      maximum-pool-size: 5
      data-source-properties:
        socketTimeout: 0

app:
  alert:
    type: DISCORD
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL}

---
spring:
  config:
    activate:
      on-profile: prod

storage:
  datasource:
    core:
      minimum-idle: 0
      maximum-pool-size: 5
      data-source-properties:
        socketTimeout: 0

app:
  alert:
    type: DISCORD
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL}
