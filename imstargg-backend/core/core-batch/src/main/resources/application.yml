spring:
  application.name: core-batch

  profiles:
    active: local
    include:
      - db

  config:
    import:
      - logging.yml
      - brawlstars-client.yml

  main.web-application-type: none

  batch:
    job:
      enabled: true
      name: ${job.name:healthCheckJob}
    jdbc:
      initialize-schema: never
      isolation-level-for-create: default

  task:
    execution:
      thread-name-prefix: "batch-task-"
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 10000
      shutdown:
        await-termination: true
        await-termination-period: 10000

app:
  alert:
    type: NO_OPS

---
spring:
  config:
    activate:
      on-profile: local
---
spring:
  config:
    activate:
      on-profile: local-dev

---
spring:
  config:
    activate:
      on-profile: dev

app:
  alert:
    type: DISCORD
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL}

---
spring:
  config:
    activate:
      on-profile: prod

app:
  alert:
    type: DISCORD
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL}
