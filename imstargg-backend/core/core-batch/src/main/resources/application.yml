spring:
  application.name: imstargg-core-batch

  lifecycle:
    timeout-per-shutdown-phase: 30s

  profiles:
    active: local
    group:
      local:     [db]
      local-dev: [db]
      dev:       [db]
      prod:      [db]

  config:
    import:
      - logging.yml
      - brawlstars-client.yml

  main.web-application-type: none

  batch:
    job:
      enabled: true
      name: ${job.name:healthCheckJob}
    jdbc:
      initialize-schema: never
      isolation-level-for-create: default

  task:
    execution:
      thread-name-prefix: "batch-task-"
      pool:
        core-size: 10
        max-size: 10
        queue-capacity: 10000
      shutdown:
        await-termination: true
        await-termination-period: 30s

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          batch_versioned_data: false
        order_inserts: true
        order_updates: true

app:
  alert:
    type: NO_OPS
  core-api:
    url: ${CORE_API_URL:http://localhost:8080}
  player-ranking-renewal:
    request-interval-millis: ${PLAYER_RANKING_RENEWAL_REQUEST_INTERVAL_MILLIS:1000}

server:
  shutdown: graceful

---
spring:
  config:
    activate:
      on-profile: local

storage:
  datasource:
    core:
      minimum-idle: 0
      maximum-pool-size: 5
      data-source-properties:
        socketTimeout: 0

---
spring:
  config:
    activate:
      on-profile: local-dev

storage:
  datasource:
    core:
      minimum-idle: 0
      maximum-pool-size: 5
      data-source-properties:
        socketTimeout: 0

---
spring:
  config:
    activate:
      on-profile: dev

storage:
  datasource:
    core:
      minimum-idle: 0
      maximum-pool-size: 5
      data-source-properties:
        socketTimeout: 0

app:
  alert:
    type: DISCORD
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL}

---
spring:
  config:
    activate:
      on-profile: prod

storage:
  datasource:
    core:
      minimum-idle: 0
      maximum-pool-size: 5
      data-source-properties:
        socketTimeout: 0

app:
  alert:
    type: DISCORD
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL}
