resilience4j.ratelimiter:
  instances:
    brawlstars:
      limit-for-period: 1
      limit-refresh-period: 1s
      timeout-duration: 600s

app:
  client:
    brawlstars:
      url: https://api.brawlstars.com
      api-keys: ${BRAWLSTARS_API_KEYS:}

---
spring:
  config.activate.on-profile: local

---
spring:
  config.activate.on-profile:
    - local-dev
    - dev

---
spring:
  config.activate.on-profile:
    - prod

resilience4j.ratelimiter:
  instances:
    brawlstars:
      limit-for-period: 10

# 초당 약 10회라 응답 로그(INFO)는 남기지 않고 전송 실패(WARN — 타임아웃·연결 실패)만 남긴다. HTTP 오류 상태는 호출부가 로그로 남긴다
logging.level.com.imstargg.client.brawlstars.BrawlStarsApi: WARN
