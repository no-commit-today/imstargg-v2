spring.cloud.openfeign:
  client:
    config:
      brawlstars:
        connect-timeout: 2100
        read-timeout: 5000
        logger-level: full
  compression:
    response:
      enabled: false
  httpclient:
    max-connections: 2000
    max-connections-per-route: 500

# Feign 의 Slf4jLogger 는 항상 DEBUG 레벨로만 출력하므로,
# logger-level(basic/full) 이 적용되려면 클라이언트 인터페이스 로거가 DEBUG 여야 한다.
logging.level:
  com.imstargg.client.brawlstars.BrawlStarsApi: debug

resilience4j.ratelimiter:
  instances:
    brawlstars:
      limit-for-period: 1
      limit-refresh-period: 1s
      timeout-duration: 600s

app:
  client:
    brawlstars:
      url: https://api.brawlstars.com
      api-keys:
        - ${BRAWLSTARS_API_KEYS:}

---
spring:
  config.activate.on-profile: local

---
spring:
  config.activate.on-profile:
    - local-dev
    - dev

---
spring:
  config.activate.on-profile:
    - prod

  cloud.openfeign:
    client:
      config:
        brawlstars:
          logger-level: basic

resilience4j.ratelimiter:
  instances:
    brawlstars:
      limit-for-period: 10
