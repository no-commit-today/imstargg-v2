nct-chart:
  imagePullSecrets:
    - name: ecr-pull-secret
  deployment:
    enabled: false
  service:
    enabled: false
  ingress:
    enabled: false
  cronjobs:
    - name: partition-manage
      schedule: "0 2 * * *"
      image:
        repository: 347351797221.dkr.ecr.ap-northeast-2.amazonaws.com/imstargg/core-batch
        tag: "4625fdf"
        pullPolicy: Always
      command:
        - /bin/sh
        - -c
      args:
        - "java -jar /app/app.jar --job.name=partitionManageJob date=$(date +%Y-%m-%d)"
      env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
      envFrom:
        - secretRef:
            name: core-batch-secret
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 1
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
