imagePullSecrets:
  - name: ecr-pull-secret

deployment:
  replicaCount: 1
  image:
    repository: ghcr.io/nocommittoday/imstargg/core-admin
    tag: ""
    pullPolicy: Always
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 12
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

service:
  enabled: true

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: admin.imstargg.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: core-admin-tls
      hosts:
        - admin.imstargg.com
