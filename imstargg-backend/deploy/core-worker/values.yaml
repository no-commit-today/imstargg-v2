nct-chart:
  imagePullSecrets:
    - name: ecr-pull-secret
  deployment:
    replicaCount: 1
    image:
      repository: 347351797221.dkr.ecr.ap-northeast-2.amazonaws.com/imstargg/core-worker
      tag: "6acb0bd"
      pullPolicy: Always
    env:
      - name: SPRING_PROFILES_ACTIVE
        value: prod
    envFrom:
      - secretRef:
          name: core-worker-secret
    ports: []
    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        memory: 2Gi
  service:
    enabled: false
  ingress:
    enabled: false
