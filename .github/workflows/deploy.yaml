name: Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: '배포할 애플리케이션'
        required: true
        type: choice
        options:
          - core-api
          - core-batch
          - core-worker

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build JAR
        working-directory: imstargg-backend
        run: |
          ./gradlew :core:${{ inputs.app }}:bootJar -x test --no-daemon
          find core/${{ inputs.app }}/build/libs -name "*.jar" -not -name "*plain*" \
            -exec cp {} ${{ github.workspace }}/app.jar \;

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-jar
          path: app.jar

  build-and-push:
    needs: build-jar
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app }}-jar
          path: jar

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          VERSION=$(./imstargg-deploy/scripts/get-app-version.sh "${{ inputs.app }}")
          echo "IMAGE_TAG=${VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: jar
          file: imstargg-backend/core/${{ inputs.app }}/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.login-ecr.outputs.registry }}/imstargg/${{ inputs.app }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

  cleanup:
    needs: build-and-push
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === '${{ inputs.app }}-jar' || artifact.name.endsWith('.dockerbuild')) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

  update-image-tags:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update image tag
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          VERSION=$(./imstargg-deploy/scripts/get-app-version.sh "${{ inputs.app }}")
          IMAGE_TAG="${VERSION}-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          cd imstargg-deploy/apps/prod

          if [ "${{ inputs.app }}" == "core-batch" ]; then
            yq e ".cronjob.image.repository = \"${ECR_REGISTRY}/imstargg/core-batch\"" -i core-batch/values.yaml
            yq e ".cronjob.image.tag = \"${IMAGE_TAG}\"" -i core-batch/values.yaml
          else
            yq e ".deployment.image.repository = \"${ECR_REGISTRY}/imstargg/${{ inputs.app }}\"" -i ${{ inputs.app }}/values.yaml
            yq e ".deployment.image.tag = \"${IMAGE_TAG}\"" -i ${{ inputs.app }}/values.yaml
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imstargg-deploy/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update ${{ inputs.app }} image tag to ${IMAGE_TAG}"

          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push failed, rebasing and retrying ($i/5)..."
            git pull --rebase
          done
          echo "Failed to push after 5 attempts"
          exit 1
