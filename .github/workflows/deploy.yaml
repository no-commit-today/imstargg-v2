name: Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: '배포할 애플리케이션'
        required: true
        type: choice
        options:
          - core-api
          - core-admin
          - core-batch
          - core-worker

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build JAR
        working-directory: imstargg-backend
        run: |
          ./gradlew :core:${{ inputs.app }}:bootJar -x test --no-daemon
          find core/${{ inputs.app }}/build/libs -name "*.jar" -not -name "*plain*" \
            -exec cp {} ${{ github.workspace }}/app.jar \;

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-jar
          path: app.jar

  build-and-push:
    needs: build-jar
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app }}-jar
          path: jar

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - uses: docker/build-push-action@v6
        with:
          context: jar
          file: imstargg-backend/core/${{ inputs.app }}/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.login-ecr.outputs.registry }}/imstargg/${{ inputs.app }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

  update-image-tags:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update image tag
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          cd imstargg-backend/deploy

          if [ "${{ inputs.app }}" == "core-batch" ]; then
            yq e ".nct-chart.cronjobs[].image.repository = \"${ECR_REGISTRY}/imstargg/core-batch\"" -i core-batch/values.yaml
            yq e ".nct-chart.cronjobs[].image.tag = \"${IMAGE_TAG}\"" -i core-batch/values.yaml
          else
            yq e ".nct-chart.deployment.image.repository = \"${ECR_REGISTRY}/imstargg/${{ inputs.app }}\"" -i ${{ inputs.app }}/values.yaml
            yq e ".nct-chart.deployment.image.tag = \"${IMAGE_TAG}\"" -i ${{ inputs.app }}/values.yaml
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imstargg-backend/deploy/
          git diff --staged --quiet || git commit -m "chore: update ${{ inputs.app }} image tag to ${GITHUB_SHA::7}"
          git push
