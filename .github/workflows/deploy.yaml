name: Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: '배포할 애플리케이션'
        required: true
        type: choice
        options:
          - core-api
          - core-batch
          - core-worker

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          VERSION=$(./imstargg-deploy/scripts/get-app-version.sh "${{ inputs.app }}")
          echo "image_tag=${VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: imstargg-backend
          file: imstargg-backend/Dockerfile
          build-args: |
            GRADLE_MODULE=:core:${{ inputs.app }}
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.login-ecr.outputs.registry }}/imstargg/${{ inputs.app }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

  update-image-tags:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update image tag
        run: |
          ./imstargg-deploy/scripts/update-image-tag.sh \
            "${{ inputs.app }}" \
            "${{ needs.build-and-push.outputs.registry }}/imstargg/${{ inputs.app }}" \
            "${{ needs.build-and-push.outputs.image_tag }}"

      - name: Commit and push
        env:
          APP: ${{ inputs.app }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imstargg-deploy/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update ${APP} image tag to ${IMAGE_TAG}"

          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push failed, rebasing and retrying ($i/5)..."
            git pull --rebase
          done
          echo "Failed to push after 5 attempts"
          exit 1
