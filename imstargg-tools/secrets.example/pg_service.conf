# Example only. The user fills in .secrets/pg_service.conf privately.
[live]
host=YOUR_DB_HOST
port=5432
dbname=YOUR_DATABASE
user=YOUR_DB_USER
connect_timeout=5
# Agent-safe session defaults (not a security boundary; SET can override them).
options=-c default_transaction_read_only=on -c statement_timeout=30s
# For a remote DB, configure verified TLS with its CA certificate:
# sslmode=verify-full
# sslrootcert=/absolute/path/to/provider-ca.pem
